name: Build and release macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GK_RELEASE_ROOT: ${{ github.workspace }}/.local/releases/build
      GK_BUILD_NUMBER: ${{ github.run_number }}
      GK_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release configuration
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in CERTIFICATE CERT_PASSWORD APPLE_ID APPLE_PASSWORD GK_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Complete docs/releases.md before publishing."
              exit 1
            fi
          done
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          data = json.loads(Path('release/models.json').read_text())
          result = subprocess.check_output(['gh', 'release', 'view', data['release_tag'],
              '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'assets'])
          assets = {a['name']: a['size'] for a in json.loads(result)['assets']}
          for model in data['models']:
              for part in model['parts']:
                  if assets.get(part['name']) != part['bytes']:
                      raise SystemExit('Missing model asset: ' + part['name'] + '. See docs/releases.md.')
          PY
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.6.12'
          enable-cache: false
      - name: Install pinned Python environments
        run: |
          uv sync --locked --python 3.12.9
          uv venv --python .venv/bin/python .local/laya/.venv
          uv pip install --python .local/laya/.venv/bin/python -r experiments/laya/requirements.lock
      - name: Test Python and Swift core
        run: |
          # Hosted Macs do not provide the Metal GPU needed by this one MLX test.
          .venv/bin/python -m pytest -q -k 'not test_logits_outside_the_current_branch_are_masked'
          swift test --package-path apps/macos/GroundKeeperCore --scratch-path .local/macos/CoreBuild
      - name: Import signing identity into a temporary keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/groundkeeper-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          export GK_CERT_PATH="$RUNNER_TEMP/groundkeeper-signing.p12"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path(os.environ['GK_CERT_PATH'])
          p.write_bytes(base64.b64decode(os.environ['CERTIFICATE']))
          p.chmod(0o600)
          PY
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$GK_CERT_PATH" -P "$CERT_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm "$GK_CERT_PATH"
          python3 - <<'PY'
          import os, re, subprocess
          result = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning'], text=True)
          names = re.findall(r'"(Developer ID Application:[^"\n]+)"', result)
          if len(names) != 1:
              raise SystemExit('Import exactly one Developer ID Application identity. Apple Development cannot notarize a release.')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('GK_SIGNING_IDENTITY=' + names[0] + '\n')
          PY
      - name: Build and package the app with its Python worker
        run: bash scripts/build_release.sh
      - name: Notarize and staple the installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "$GK_RELEASE_ROOT/assets/GroundKeeper-arm64.dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$GK_TEAM_ID" \
            --wait --timeout 20m --output-format json > "$GK_RELEASE_ROOT/notarization.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['GK_RELEASE_ROOT']) / 'notarization.json').read_text())
          if result.get('status') != 'Accepted':
              raise SystemExit('Notarization was not accepted: ' + str(result.get('status')))
          PY
          xcrun stapler staple "$GK_RELEASE_ROOT/assets/GroundKeeper-arm64.dmg"
          xcrun stapler validate "$GK_RELEASE_ROOT/assets/GroundKeeper-arm64.dmg"
          hdiutil verify "$GK_RELEASE_ROOT/assets/GroundKeeper-arm64.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-installer
          path: .local/releases/build/assets/GroundKeeper-arm64.dmg
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/groundkeeper-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/groundkeeper-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/groundkeeper-signing.p12"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-installer
          path: .local/release-assets
      - name: Fetch and verify the pinned model packages
        run: python3 -m scripts.release_models download --repo "$GITHUB_REPOSITORY" --output .local/release-assets
      - name: Add Shortcuts, installation guide, and checksums
        run: |
          cp docs/install.md .local/release-assets/INSTALL.md
          cp release/models.json .local/release-assets/models.json
          cp release/MODEL-NOTICES.txt .local/release-assets/MODEL-NOTICES.txt
          cp shortcuts/*.shortcut .local/release-assets/
          cp shortcuts/README.md .local/release-assets/SHORTCUTS.md
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.local/release-assets')
          lines = []
          for path in sorted(root.iterdir()):
              if path.stat().st_size >= 2 * 1024**3:
                  raise SystemExit('Asset exceeds GitHub limit: ' + path.name)
              with path.open('rb') as stream:
                  lines.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + path.name)
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          PY
      - name: Publish a complete prerelease for this commit
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}-${GITHUB_RUN_ATTEMPT}"
          cp release/notes.md "$RUNNER_TEMP/release-notes.md"
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GroundKeeper build $GITHUB_RUN_NUMBER" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft --prerelease .local/release-assets/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
