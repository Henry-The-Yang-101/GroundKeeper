name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.6.12'
      - name: Install Python and development dependencies
        run: uv sync --locked --python 3.12.9 --group dev
      - name: Check generated database reference
        run: .venv/bin/python -m scripts.database_schema --check
      - name: Run all CPU tests
        run: .venv/bin/python -m pytest -q -m "not gpu"

  swift-core:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      # ReceiptOCR needs the macOS 26 SDK, even with a runtime availability check.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain and SDK
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Test the standalone ledger core
        run: swift test --package-path apps/macos/GroundKeeperCore --scratch-path .local/macos/CoreBuild
