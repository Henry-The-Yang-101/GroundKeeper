[project]
name = "groundkeeper-experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mlx-lm>=0.31,<0.33; sys_platform == 'darwin'",
  "huggingface-hub>=0.34",
  "pyarrow>=20",
  "rapidfuzz>=3.14",
  "scikit-learn>=1.7",
  "psutil>=7",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["gpu: requires an available Metal GPU (MLX or PyTorch MPS)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
